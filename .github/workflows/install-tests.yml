name: Installation tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      models:
        description: Download both default 0.6B models and test offline CPU speech on all three OSes (~4 GB per OS)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: installation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_NO_INPUT: '1'
  PYTHONUTF8: '1'
  PYTHONNOUSERSITE: '1'

jobs:
  runtime-install:
    name: Fresh runtime · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install Linux GUI system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 xvfb xauth dbus-x11 sox
      - name: Install all app dependencies in a fresh private environment
        run: python tools/ci_install.py
      - name: Verify installed runtime, extraction, native GUI, and model setup
        run: python tools/ci_checks.py ${{ inputs.models && '--models' || '' }}
      - name: Upload diagnostics and GUI screenshots (never models)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: install-${{ runner.os }}-${{ runner.arch }}
          path: |
            test-output/ci/*.log
            test-output/appearance/*.png
          if-no-files-found: ignore
          retention-days: 7
