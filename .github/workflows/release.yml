name: Build and publish installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: .venv/bin/python
          - os: windows-2025
            python: .venv/Scripts/python.exe
          - os: macos-15
            python: .venv/bin/python
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libegl1 libopengl0 libdbus-1-3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 xvfb xauth
      - name: Install private build dependencies
        run: |
          python tools/ci_install.py
          ${{ matrix.python }} -m pip install PyInstaller==6.22.2 Pillow uv==0.12.10
      - name: Build native installer without model weights
        run: |
          ${{ matrix.python }} -m unittest discover -s tests -q
          ${{ matrix.python }} tools/build_native.py
      - name: Install artifact and verify offline narration after model setup
        run: python tools/test_native.py
      - name: Verify RPM installation in a fresh Fedora container
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD/dist/installers:/installers:ro" fedora:44 sh -ec 'dnf install -y /installers/PDF-to-Audio-Linux-x86_64.rpm; /opt/pdf-to-audio/pdf-to-audio-worker --check; QT_QPA_PLATFORM=offscreen /opt/pdf-to-audio/pdf-to-audio --gui-smoke; /opt/pdf-to-audio/pdf-to-audio-worker --setup-models; /opt/pdf-to-audio/pdf-to-audio-worker --self-test'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ runner.os }}-${{ runner.arch }}
          path: dist/installers/*
          retention-days: 14
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      - name: Publish tested installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd installers && sha256sum * > SHA256SUMS)
          gh release create v0.2.0 installers/* --target "$GITHUB_SHA" --title "PDF to Audio 0.2.0" --notes-file packaging/RELEASE_NOTES.md
